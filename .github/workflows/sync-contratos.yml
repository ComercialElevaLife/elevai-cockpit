name: Sincroniza snapshot de contratos (Renovações)

# 14/09/2026 -- Léo: "Scan de renovações" diário (Claude) precisa ler o status atual da aba
# Renovações (statusRenovacao por contrato) para cruzar com e-mail/Teams -- mas, pelo mesmo motivo
# do scan-notificacoes.yml, a sessão de nuvem que roda o scan não tem acesso de rede direto ao
# domínio do Cockpit. Este workflow roda 1x/dia num runner do GitHub (sem essa restrição), busca
# GET /api/contratos-sync e grava um snapshot na branch scan-queue -- de onde o scan diário lê via
# git pull. Não mexe na branch main (evita disparar o deploy.yml por um dado que muda todo dia).
#
# 14/09/2026 -- fix 1: GET /api/contratos exige login Microsoft (AAD) na própria plataforma do
# Cockpit (staticwebapp.config.json: "/api/*" -> allowedRoles authenticated), por isso falhava
# aqui (o runner não tem sessão). Criada rota dedicada /api/contratos-sync, anônima na plataforma
# mas protegida por um token secreto próprio (header X-Sync-Token, comparado no código contra a
# app setting CONTRATOS_SYNC_TOKEN) -- só leitura, nunca grava nada. Token guardado como secret do
# GitHub (CONTRATOS_SYNC_TOKEN), nunca aparece em texto no código nem nos logs.
#
# 14/09/2026 -- fix 2: run #4 passou no download/parse mas não commitou nada -- "git diff --quiet"
# só compara arquivos JÁ rastreados pelo git; como este era o primeiro snapshot (arquivo novo,
# nunca commitado), o git não considerou isso uma "mudança" e o commit foi pulado silenciosamente.
# Trocado por "git status --porcelain", que cobre tanto arquivo novo (untracked) quanto modificado.

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 America/Sao_Paulo -- roda antes do Scan de renovacoes (11:45 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scan-queue
      - name: Buscar contratos atuais e gravar snapshot
        env:
          SYNC_TOKEN: ${{ secrets.CONTRATOS_SYNC_TOKEN }}
        run: |
          set -e
          mkdir -p renovacoes-data
          HTTP_STATUS=$(curl -sS -L "https://red-mushroom-08695330f.7.azurestaticapps.net/api/contratos-sync" -H "X-Sync-Token: $SYNC_TOKEN" -o renovacoes-data/contratos-atual.json --max-time 30 -w "%{http_code}")
          echo "HTTP status final (apos redirects): $HTTP_STATUS"
          echo "--- Tamanho do arquivo baixado ---"
          wc -c renovacoes-data/contratos-atual.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "--- Primeiros 500 caracteres do corpo (erro) ---"
            head -c 500 renovacoes-data/contratos-atual.json
            echo ""
            echo "GET /api/contratos-sync falhou (HTTP $HTTP_STATUS) -- mantendo snapshot anterior"
            exit 1
          fi
          python3 -c "import json; json.load(open('renovacoes-data/contratos-atual.json'))"
      - name: Commitar snapshot (se mudou)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- renovacoes-data/contratos-atual.json)" ]; then
            echo "sem mudanças -- nada a commitar"
            exit 0
          fi
          git add renovacoes-data/contratos-atual.json
          git commit -m "Snapshot diário de contratos (auto, $(date -u +%Y-%m-%d))"
          git push origin scan-queue
