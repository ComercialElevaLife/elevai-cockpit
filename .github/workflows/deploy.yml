name: Deploy ElevAI Cockpit (Azure Static Web Apps)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy para Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "frontend"
          api_location: "api"
          output_location: ""
          skip_app_build: true
          skip_api_build: true
      # 10/09/2026 -- sino de notificações (Léo): cada deploy vira um item na aba "Novidades do
      # sistema" do sino, automaticamente -- sem isso, o changelog do sino ficaria manual. Nunca
      # falha o deploy: continue-on-error + try/except próprio (best-effort).
      - name: Registrar novidade no sino do Cockpit
        if: success()
        continue-on-error: true
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF2'
          import json, os, urllib.request, datetime
          msg = os.environ.get("COMMIT_MSG", "").strip() or "Atualização do sistema"
          titulo = msg.splitlines()[0][:120]
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          payload = {
              "tipo": "sistema",
              "status": "",
              "titulo": titulo,
              "detalhe": msg + ("\n\ncommit " + sha if sha else ""),
              "origem": "sistema",
              "criadoEm": datetime.datetime.utcnow().isoformat() + "Z",
              "alteradoPor": "GitHub Actions",
          }
          req = urllib.request.Request(
              "https://red-mushroom-08695330f.7.azurestaticapps.net/api/notificacoes",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as e:
              print("Aviso: falha ao registrar novidade no sino (nao bloqueia o deploy):", e)
          PYEOF2
