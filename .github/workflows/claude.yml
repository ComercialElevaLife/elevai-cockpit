name: Claude Code

# Responde quando alguem menciona @claude num comentario de issue ou PR.
# Autenticacao via CLAUDE_CODE_OAUTH_TOKEN (assinatura Claude Team do Leo, gerado com
# "claude setup-token") -- sem cobranca extra por token de API.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
